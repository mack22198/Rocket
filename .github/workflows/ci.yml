name: CI

on:
  push:
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Rojo, StyLua, Selene, Lune, luau-lsp)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src

      - name: Unit tests
        run: lune run tests/run

      - name: Type check against the Roblox API
        run: |
          curl -fsSL -o roblox.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.0/scripts/globalTypes.None.d.luau
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions=@roblox=roblox.d.luau --sourcemap=sourcemap.json src

      - name: Build the place file
        run: rojo build default.project.json -o TurboBall.rbxlx

      - name: Upload the place file
        uses: actions/upload-artifact@v4
        with:
          name: TurboBall-place
          path: TurboBall.rbxlx
